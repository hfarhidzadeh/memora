[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "memora-agent-memory"
version = "0.2.0"
description = "A local-first prototype for typed, self-curating agent memory."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
embeddings = ["sentence-transformers>=2.2"]

[project.scripts]
memora = "dynmemory.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
